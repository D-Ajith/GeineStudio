<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- ══════════════════════════════════════════════════════════════════
       ANALYTICS — loaded after the page has finished loading.
       gtag.js was previously the very first thing in <head>. Even with
       `async` it still downloaded, parsed and executed during exactly the
       window that LCP and Total Blocking Time are measured in, on a phone
       CPU that has better things to do. Queuing the calls up front and
       injecting the script on `load` keeps every pageview and event intact
       while moving ~60 KB of third-party JS out of the critical path.
       ══════════════════════════════════════════════════════════════════ -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    // These queue into dataLayer now and are replayed when gtag.js arrives,
    // so no hit is lost by loading the library later.
    gtag('js', new Date());
    gtag('config', 'G-WCR1MCHLMK');

    (function () {
      var loaded = false;
      function loadGtag() {
        if (loaded) return;
        loaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-WCR1MCHLMK';
        document.head.appendChild(s);
      }
      // Whichever comes first: the page finishing load, or the visitor doing
      // something — the latter matters so a fast bounce is still recorded.
      if (document.readyState === 'complete') loadGtag();
      else window.addEventListener('load', loadGtag, { once: true });
      ['pointerdown', 'keydown', 'touchstart'].forEach(function (evt) {
        window.addEventListener(evt, loadGtag, { once: true, passive: true });
      });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ══════════════════════════════════════════════════════════════════
       PRIMARY SEO
       This is a client-rendered SPA, so every route is served this same
       HTML. Googlebot runs the JS and picks up the per-route <title> and
       <meta> that the <Seo> component renders (React 19 hoists those into
       <head>). Crawlers that do NOT run JS — Facebook, LinkedIn, WhatsApp,
       Slack — only ever see what is written here, which is why the homepage
       values are the static defaults.
       ══════════════════════════════════════════════════════════════════ -->
  <title>Genie Studio | Photography, Podcast, Product &amp; Professional Shoots</title>
  <meta name="description"
    content="Genie Studio is a professional creative studio in Visakhapatnam offering photography, podcast shoots, product shoots, corporate shoots, event shoots, professional shoots and business portfolio photography." />
  <link rel="canonical" href="https://geniestudio.in/" />

  <!-- Local signals. Google reads the LocalBusiness JSON-LD below as the
       authority, but these are still used by some crawlers and directories. -->
  <meta name="geo.region" content="IN-AP" />
  <meta name="geo.placename" content="Visakhapatnam" />

  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="author" content="Genie Studio" />
  <meta name="theme-color" content="#6B4A2D" />

  <!-- ══════════════════════════════════════════════════════════════════
       FAVICON / APP ICONS
       ══════════════════════════════════════════════════════════════════ -->
  <link rel="icon" type="image/png" sizes="32x32" href="/GenieStudio.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/GenieStudio.png" />
  <link rel="apple-touch-icon" href="/GenieStudio.png" />
  <link rel="shortcut icon" href="/GenieStudio.png" />

  <!-- ══════════════════════════════════════════════════════════════════
       OPEN GRAPH / TWITTER
       ══════════════════════════════════════════════════════════════════ -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Genie Studio" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:title"
    content="Genie Studio | Photography, Podcast, Product &amp; Professional Shoots" />
  <meta property="og:description"
    content="Genie Studio is a professional creative studio in Visakhapatnam offering photography, podcast shoots, product shoots, corporate shoots, event shoots, professional shoots and business portfolio photography." />
  <meta property="og:url" content="https://geniestudio.in/" />
  <meta property="og:image" content="https://geniestudio.in/uploads/1786601041_1786601041120-705832864.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Genie Studio — professional photography and video studio in Yendada, Visakhapatnam" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title"
    content="Genie Studio | Photography, Podcast, Product &amp; Professional Shoots" />
  <meta name="twitter:description"
    content="Genie Studio is a professional creative studio in Visakhapatnam offering photography, podcast shoots, product shoots, corporate shoots, event shoots, professional shoots and business portfolio photography." />
  <meta name="twitter:image" content="https://geniestudio.in/uploads/1786601041_1786601041120-705832864.png" />

  <!-- Every photo on the site comes from this origin. Opening the TCP + TLS
       connection during HTML parse saves a full round trip before the first
       image byte arrives — worth ~100-300ms on mobile networks. -->
  <link rel="preconnect" href="https://geniestudio.in" crossorigin>
  <link rel="dns-prefetch" href="https://geniestudio.in">

  <!-- Blog/portfolio/gallery data comes from Render, whose free tier cold
       starts; warming the connection early overlaps some of that latency. -->
  <link rel="preconnect" href="https://geinestudio-czl3.onrender.com" crossorigin>

  <!-- The header logo renders on every route, so it is always in the critical
       path. -->
  <link rel="preload" as="image" href="/GenieStudio-logo.webp" fetchpriority="high">

  <!-- ══════════════════════════════════════════════════════════════════
       LCP PRELOAD — the homepage hero.
       This is a client-rendered SPA: index.html contains no hero markup, so
       the browser's preload scanner cannot see the hero at all. It only
       learns about the image after downloading React, parsing it, and
       rendering the inline background-image — a four-step chain that is
       exactly what PageSpeed flags as "LCP request discovery". Declaring it
       here starts the fetch on the first byte instead.

       imagesrcset/imagesizes so a phone still pulls the 400/800 file rather
       than the desktop one — preloading the wrong size would trade one
       problem for another.

       TRADE-OFF: this preload also fires on routes that do not use the image,
       costing them one wasted request. It is worth it because "/" is the
       primary landing page and its hero is the LCP element; it would not be
       worth it for an image only used deeper in the site.
       ══════════════════════════════════════════════════════════════════ -->
  <link rel="preload" as="image" fetchpriority="high"
    imagesrcset="https://geniestudio.in/uploads/1786619977_1786601041_1786601041120-705832864-400.webp 400w,
                 https://geniestudio.in/uploads/1786619978_1786601041_1786601041120-705832864-800.webp 800w,
                 https://geniestudio.in/uploads/1786619978_1786601041_1786601041120-705832864-1200.webp 1200w"
    imagesizes="100vw"
    href="https://geniestudio.in/uploads/1786619978_1786601041_1786601041120-705832864-800.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- ══════════════════════════════════════════════════════════════════
       FONT — non-blocking.
       Cormorant Garamond styles every h1–h6, so it sits on the LCP path.
       As a plain <link rel="stylesheet"> it blocked first render until
       Google's CSS came back; the media="print" swap lets the browser paint
       immediately and apply the font as soon as it arrives (`display=swap`
       already governed that hand-off, so the final rendering is identical).

       Weights trimmed 400;500;600;700 -> 600;700: this family is applied ONLY
       to headings, and every heading in the app carries font-semibold (600),
       font-bold (700), font-extrabold or font-black. Nothing rendered 400 or
       500, so those two files were downloaded and never drawn. 800/900 are
       deliberately still not requested — the browser synthesises them from
       700 today, and shipping the real cuts would change how those headings
       look.
       ══════════════════════════════════════════════════════════════════ -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap">
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       STRUCTURED DATA
       Kept in the static HTML rather than rendered by React so that it is
       present on the very first byte, with no dependency on JS execution.

       WebSite carries the SearchAction so Google can offer a sitelinks
       search box; LocalBusiness is what makes the studio eligible for local
       and map results, which is the point of naming Visakhapatnam.
       ══════════════════════════════════════════════════════════════════ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://geniestudio.in/#website",
        "name": "GenieStudio",
        "alternateName": ["Genie Studio", "Genie Studio Visakhapatnam"],
        "url": "https://geniestudio.in/",
        "description": "Genie Studio is a professional creative studio in Visakhapatnam offering photography, podcast shoots, product shoots, corporate shoots, event shoots, professional shoots and business portfolio photography.",
        "inLanguage": "en-IN",
        "publisher": { "@id": "https://geniestudio.in/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://geniestudio.in/blogs?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "Organization",
        "@id": "https://geniestudio.in/#organization",
        "name": "GenieStudio",
        "alternateName": ["Genie Studio", "Genie Studio Visakhapatnam"],
        "url": "https://geniestudio.in/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://geniestudio.in/GenieStudio.png"
        },
        "description": "Genie Studio is a professional creative studio in Visakhapatnam offering photography, podcast shoots, product shoots, corporate shoots, event shoots, professional shoots and business portfolio photography."
      },
      {
        "@type": "PhotographyBusiness",
        "@id": "https://geniestudio.in/#localbusiness",
        "name": "Genie Studio",
        "alternateName": ["GenieStudio", "Genie Studio Visakhapatnam"],
        "url": "https://geniestudio.in/",
        "image": "https://geniestudio.in/GenieStudio.png",
        "description": "Genie Studio is a professional creative studio in Visakhapatnam offering photography, podcast shoots, product shoots, corporate shoots, event shoots, professional shoots and business portfolio photography.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "5A-2, KP Icon, Yendada",
          "addressLocality": "Visakhapatnam",
          "addressRegion": "Andhra Pradesh",
          "postalCode": "530045",
          "addressCountry": "IN"
        },
        "areaServed": {
          "@type": "City",
          "name": "Visakhapatnam"
        },
        "parentOrganization": { "@id": "https://geniestudio.in/#organization" },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Photography and Video Production Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Podcast Shoots",
                "url": "https://geniestudio.in/services/podcast-shoots"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Product Shoots",
                "url": "https://geniestudio.in/services/product-shoots"
              }
            },
            {
